<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm Your Age</title>
  <meta name="description" content="SWAG Age Verification">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body {
      background: #18171d;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'PingFang TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: #232228;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      max-width: 480px;
      width: 90vw;
      padding: 40px 32px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .modal-title {
      color: #00D2BE;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }
    .modal-subtitle {
      color: #ffe066;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 18px;
      text-align: center;
    }
    .modal-section-title {
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 6px;
      align-self: flex-start;
    }
    .modal-text {
      color: #e0e0e0;
      font-size: 1rem;
      margin-bottom: 8px;
      line-height: 1.7;
      text-align: left;
    }
    .modal-legal {
      color: #aaa;
      font-size: 0.95rem;
      margin: 18px 0 8px 0;
      line-height: 1.6;
      text-align: left;
      border-top: 1px solid #333;
      padding-top: 10px;
      width: 100%;
    }
    .modal-legal strong {
      color: #ffe066;
    }
    .modal-options {
      margin: 18px 0 0 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }
    .modal-options span {
      font-size: 1rem;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-btns {
      display: flex;
      gap: 16px;
      margin-top: 18px;
      width: 100%;
      justify-content: center;
    }
    .modal-btn {
      background: #00D2BE;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 12px 32px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .modal-btn.secondary {
      background: #444;
      color: #fff;
    }
    .modal-btn:hover {
      background: #e0266a;
    }
    .modal-btn.secondary:hover {
      background: #666;
    }
    .modal-footer {
      margin-top: 24px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      font-size: 0.95rem;
      color: #aaa;
    }
    .modal-footer a {
      color: #fff;
      text-decoration: none;
      transition: color 0.2s;
    }
    .modal-footer a:hover {
      color: #00D2BE;
    }
    .modal-legal a {
      color: #fff;
      text-decoration: none;
      transition: color 0.2s;
    }
    .modal-legal a:hover {
      color: #00D2BE;
    }
  </style>
  <script>
  (function() {
    var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    var isZh = lang.startsWith('zh');
    var seo = {
      zh: {
        title: '年齡驗證｜SWAG',
        desc: '請確認您已滿 18 歲才能進入 SWAG，亞洲最大自由創作平台。'
      },
      en: {
        title: "Confirm Your Age",
        desc: "Access the Digital Content Platform"
      }
    };
    var selected = isZh ? seo.zh : seo.en;
    document.title = selected.title;
    var metaDesc = document.querySelector('meta[name=\"description\"]');
    if (metaDesc) {
      metaDesc.setAttribute('content', selected.desc);
    } else {
      var meta = document.createElement('meta');
      meta.name = 'description';
      meta.content = selected.desc;
      document.head.appendChild(meta);
    }
  })();
  </script>
</head>
<body>
  <div class="modal">
    <div class="modal-title">確認您的年齡</div>
    <div class="modal-subtitle">SWAG 年齡驗證</div>
    <div class="modal-section-title">進入數位創作平台</div>
    <div class="modal-text">
      SWAG 是合規的數位內容創作平台，為保護未成年人權益，本平台設有年齡驗證機制，僅限成年用戶使用。平台內容均符合相關法規規範，提供安全的線上創作與互動環境。
    </div>
    <div class="modal-legal">
      <strong>法律聲明：</strong><br>
      本服務遵循《中華民國民法》第 12 條及相關法規<br>
      符合 iWIN 網路內容防護機構防護層級規範<br>
      依據《兒童及少年福利與權益保障法》第 46 條設置防護機制<br>
      建立完善的內容審查與年齡驗證系統<br>
      <span style="color:#00D2BE;font-weight:bold;">未滿 18 歲者禁止進入</span> | <a href="#">使用條款</a> | <a href="#">隱私政策</a> | <a href="#">家長監控</a>
    </div>
    <div class="modal-btns">
      <button class="modal-btn" onclick="window.location.replace('https://swag.live/')">我已滿 18 歲，進入 SWAG</button>
      <button class="modal-btn secondary" onclick="window.location.replace('https://youtu.be/4bMOTTJqGgM?si=hwnM3IoqmgRANH7d')">離開網站</button>
    </div>
  </div>
</body>
</html>
